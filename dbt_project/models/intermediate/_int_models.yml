version: 2

models:
  - name: int_cart_items
    columns:
      - name: cart_item_id
        tests:
          - unique
          - not_null
      - name: product_id
        tests:
          - relationships:
              to: ref('stg_products')
              field: id_product
      - name: product_quantity
        tests:
          - dbt_utils.accepted_range:
              min_value: 1

  - name: int_product_reviews
    columns:
      - name: review_id
        tests:
          - unique